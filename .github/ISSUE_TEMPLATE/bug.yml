name: Bug report
description: Something broke (or a plane clipped through a hill)
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened?, description: Steps to reproduce, what you expected }
    validations: { required: true }
  - type: input
    id: env
    attributes: { label: Browser / OS / GPU, placeholder: "Chrome 130, macOS 15, Apple M2 — Quality: High" }
  - type: textarea
    id: console
    attributes: { label: Console output, render: text }
